name: Cross-platform validation
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - run: swift test --scratch-path "$RUNNER_TEMP/yuki-build"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build Windows/YukiCompanion.Windows.csproj --configuration Release
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check ChromeExtension/background.js
      - run: node --check ChromeExtension/content.js
      - run: node --check ChromeExtension/popup.js
      - run: test -f ChromeExtension/manifest.json && test -f PetAssets/Production/animations.json && test -f Shared/Configuration/companion.schema.json
