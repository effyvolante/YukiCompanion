name: Cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      # Keep the known-good macOS implementation on its Swift 5 language-mode
      # compatibility boundary even when the runner ships a Swift 6 frontend.
      - run: swift test -Xswiftc -swift-version -Xswiftc 5 -Xswiftc -Xfrontend -Xswiftc -strict-concurrency=minimal -Xswiftc -Xfrontend -Xswiftc -disable-actor-data-race-checks --scratch-path "$RUNNER_TEMP/yuki-build"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Windows projects
        run: dotnet restore Windows/YukiCompanion.Windows.csproj && dotnet restore Windows.Tests/Windows.Tests.csproj
      - name: Build Windows app
        run: dotnet build Windows/YukiCompanion.Windows.csproj --configuration Release --no-restore
      - name: Build Windows bridge tests
        run: dotnet build Windows.Tests/Windows.Tests.csproj --configuration Release --no-restore
      - name: Run Windows bridge tests
        run: dotnet test Windows.Tests/Windows.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=normal"
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate extension JavaScript
        run: node --check ChromeExtension/background.js && node --check ChromeExtension/content.js && node --check ChromeExtension/popup.js
      - name: Validate extension manifest and product assets
        run: python3 -c "import json; json.load(open('ChromeExtension/manifest.json')); json.load(open('Shared/Configuration/companion.schema.json')); json.load(open('PetAssets/Production/animations.json'))"
      - run: test -f ChromeExtension/manifest.json && test -f PetAssets/Production/animations.json && test -f Shared/Configuration/companion.schema.json
